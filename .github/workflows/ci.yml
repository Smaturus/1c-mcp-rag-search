name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    name: lint + types + unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Unit tests cover BM25, RRF, reranker wrapper and metrics — they do not
      # need the ML stack (chromadb / sentence-transformers / flashrank are
      # imported lazily), so CI stays fast and dependency-light.
      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      # TEMPORARY diagnostics: emit the mypy output as a workflow annotation so
      # it can be inspected without downloading logs.
      - name: Type check (mypy)
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          mypy --version
          set +e
          mypy 2>&1 | tee mypy.log
          code=${PIPESTATUS[0]}
          echo "MYPY_EXIT=$code" >> "$GITHUB_OUTPUT"
          echo "mypy exit: $code"

      - name: Publish mypy diagnostics
        if: always()
        shell: bash
        run: |
          echo "mypy exit: ${{ steps.mypy.outputs.MYPY_EXIT }}"
          tail -n 6 mypy.log || true
          msg=$(tail -n 6 mypy.log | tr '\n' ' ' | tr -d '"\\')
          echo "::error title=mypy-diag::$msg"
          exit 1

      - name: Unit tests (pytest)
        if: always()
        run: pytest -q
        env:
          PYTHONPATH: src
