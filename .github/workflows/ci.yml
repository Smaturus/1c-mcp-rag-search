name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: the workflow only reads the repository (CodeQL also flags
# workflows without an explicit permissions block).
permissions:
  contents: read

jobs:
  lint-test:
    name: lint + types + unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening; CodeQL flags
      # mutable tags). Dependabot keeps these pins up to date.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Unit tests cover BM25, RRF, reranker wrapper and metrics — they do not
      # need the ML stack (chromadb / sentence-transformers / flashrank are
      # imported lazily), so CI stays fast and dependency-light.
      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Unit tests (pytest)
        run: pytest -q
        env:
          PYTHONPATH: src
