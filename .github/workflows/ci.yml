name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    name: lint + types + unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Unit tests cover BM25, RRF, reranker wrapper and metrics — they do not
      # need the ML stack (chromadb / sentence-transformers / flashrank are
      # imported lazily), so CI stays fast and dependency-light.
      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Unit tests (pytest)
        run: pytest -q
        env:
          PYTHONPATH: src
