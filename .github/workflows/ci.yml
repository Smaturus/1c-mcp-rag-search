name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: the workflow only reads the repository (CodeQL also flags
# workflows without an explicit permissions block).
permissions:
  contents: read

jobs:
  lint-test:
    name: lint + types + unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening; CodeQL flags
      # mutable tags). Dependabot keeps these pins up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Unit tests cover BM25, RRF, reranker wrapper, metrics and the MCP tool
      # surface. The ML stack (sentence-transformers / flashrank) stays lazy;
      # CI needs only the MCP SDK and Chroma for server-level tests.
      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy mcp chromadb pytest pytest-cov ruff mypy radon

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      # Ratcheting gate: known complex functions are listed in the script
      # baseline; any new block above threshold (or growth of a baseline entry)
      # fails the build.
      - name: Complexity gate (radon)
        run: python scripts/check_complexity.py

      - name: Unit tests (pytest + coverage)
        shell: bash
        run: |
          set +e
          pytest -q --cov=src/mcp_1c_rag --cov-report=term-missing --cov-fail-under=25 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## pytest failure"
              echo '```'
              tail -n 150 pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
        env:
          PYTHONPATH: src
